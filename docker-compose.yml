services:
  postgres:
    image: postgres:16-alpine
    container_name: ringerr-postgres
    environment:
      POSTGRES_DB: ringerr
      POSTGRES_USER: ringerr
      POSTGRES_PASSWORD: ringerr123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ringerr"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./ringerr-backend
      dockerfile: Dockerfile
    container_name: ringerr-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ringerr
      SPRING_DATASOURCE_USERNAME: ringerr
      SPRING_DATASOURCE_PASSWORD: ringerr123
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./ringerr-frontend
      dockerfile: Dockerfile
    container_name: ringerr-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
